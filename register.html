<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | LifeStream</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <a href="index.html" class="logo">LifeStream</a>
        <a href="login.html" class="btn btn-outline">Login</a>
    </nav>

    <div class="form-container">
        <h2 style="margin-bottom: 2rem; text-align: center;">Join LifeStream</h2>
        <form id="register-form">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" required placeholder="John Doe or City Hospital">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <div class="form-group">
                <label>Role</label>
                <select id="role" required>
                    <option value="donor">Donor</option>
                    <option value="hospital">Hospital / Organization</option>
                </select>
            </div>
            <div id="donor-fields">
                <div class="form-group">
                    <label>Blood Group</label>
                    <select id="bloodGroup">
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>Location</label>
                <input type="text" id="location" required placeholder="City, State">
            </div>
            <div class="form-group">
                <label>Date of Birth</label>
                <input type="date" id="dob" required>
            </div>
            <div id="error-message" style="color: var(--primary); margin-bottom: 1rem; display: none;"></div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Create Account</button>
        </form>
        <p style="margin-top: 1.5rem; text-align: center;">
            Already have an account? <a href="login.html" style="color: var(--primary);">Login</a>
        </p>
    </div>

    <script src="js/auth.js"></script>
    <script>
        const roleSelect = document.getElementById('role');
        const donorFields = document.getElementById('donor-fields');

        roleSelect.addEventListener('change', () => {
            donorFields.style.display = roleSelect.value === 'donor' ? 'block' : 'none';
        });

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const userData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                role: roleSelect.value,
                location: document.getElementById('location').value,
                dateOfBirth: document.getElementById('dob').value
            };

            if (userData.role === 'donor') {
                userData.bloodGroup = document.getElementById('bloodGroup').value;
            }

            const result = await register(userData);
            if (result.success) {
                window.location.href = result.user.role === 'donor' ? 'donor/dashboard.html' : 'hospital/dashboard.html';
            } else {
                const errorDiv = document.getElementById('error-message');
                errorDiv.textContent = result.message || 'Registration failed';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
