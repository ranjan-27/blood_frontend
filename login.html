<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | LifeStream</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <a href="index.html" class="logo">LifeStream</a>
        <a href="register.html" class="btn btn-outline">Register</a>
    </nav>

    <div class="form-container">
        <h2 style="margin-bottom: 2rem; text-align: center;">Welcome Back</h2>
        <form id="login-form">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <div id="error-message" style="color: var(--primary); margin-bottom: 1rem; display: none;"></div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
        </form>
        <p style="margin-top: 1.5rem; text-align: center;">
            Don't have an account? <a href="register.html" style="color: var(--primary);">Register</a>
        </p>
    </div>

    <script src="js/auth.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-message');
            
            errorDiv.style.display = 'none';
            
            const result = await login(email, password);
            if (result.success) {
                window.location.href = result.user.role === 'donor' ? 'donor/dashboard.html' : 'hospital/dashboard.html';
            } else {
                errorDiv.textContent = result.message || 'Login failed';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
